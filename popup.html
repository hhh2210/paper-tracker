<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PaperTracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Confetti Canvas for Dopamine Celebrations -->
  <canvas id="confetti-canvas"></canvas>

  <div class="pt-container">
    <!-- Top Navigation Bar -->
    <header class="pt-header">
      <div class="pt-brand">
        <div class="pt-brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <div>
          <h1 class="pt-app-title">PaperTracker</h1>
          <p class="pt-app-sub">arXiv & alphaXiv</p>
        </div>
      </div>

      <div class="pt-header-actions">
        <button id="btn-copy-digest" class="pt-btn-action pt-btn-highlight" title="一键复制今日已读论文 (Markdown)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span>导出今日</span>
        </button>
        <button id="btn-open-dashboard" class="pt-btn-action" title="打开全屏统计看板">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="9" y1="21" x2="9" y2="9"></line>
          </svg>
        </button>
        <button id="btn-settings" class="pt-btn-action" title="偏好设置">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Bento Hero Card -->
    <section class="pt-hero-card" id="hero-card">
      <div class="pt-ring-wrapper">
        <svg class="pt-progress-ring" width="80" height="80" viewBox="0 0 80 80">
          <defs>
            <linearGradient id="ring-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6366f1" />
              <stop offset="100%" stop-color="#38bdf8" />
            </linearGradient>
            <linearGradient id="ring-gradient-achieved" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#10b981" />
              <stop offset="100%" stop-color="#34d399" />
            </linearGradient>
          </defs>
          <circle class="pt-ring-bg" cx="40" cy="40" r="34" stroke-width="6" />
          <circle class="pt-ring-bar" id="goal-ring" cx="40" cy="40" r="34" stroke-width="6" stroke-dasharray="213.63" stroke-dashoffset="213.63" stroke-linecap="round" />
        </svg>
        <div class="pt-ring-inner">
          <span class="pt-ring-num" id="ring-progress-text">0/3</span>
          <span class="pt-ring-label">今日目标</span>
        </div>
      </div>

      <div class="pt-hero-details">
        <div class="pt-hero-badges">
          <div class="pt-badge-pill pt-badge-streak" id="streak-pill">
            <span class="pt-icon-fire">🔥</span>
            <span id="streak-count">0 天连击</span>
          </div>
          <div class="pt-badge-pill pt-badge-time" id="total-time-pill">
            <span class="pt-icon-time">⏱️</span>
            <span id="today-total-time">0 分钟</span>
          </div>
        </div>
        <div class="pt-hero-message" id="hero-status-message">
          今天还没有开始看论文，去 arXiv 或 alphaXiv 逛逛吧！
        </div>
      </div>
    </section>

    <!-- Settings Drawer (Collapsible) -->
    <div class="pt-settings-drawer" id="settings-drawer" style="display: none;">
      <div class="pt-settings-header">
        <span class="pt-settings-title">偏好设置</span>
        <button id="btn-close-settings" class="pt-close-btn" title="关闭设置">✕</button>
      </div>
      <div class="pt-settings-row">
        <span class="pt-label">每日阅读目标</span>
        <div class="pt-segmented-control">
          <button class="pt-goal-btn" data-goal="1">1</button>
          <button class="pt-goal-btn" data-goal="2">2</button>
          <button class="pt-goal-btn active" data-goal="3">3</button>
          <button class="pt-goal-btn" data-goal="5">5</button>
        </div>
      </div>
      <div class="pt-settings-row">
        <span class="pt-label">页面右下角灵动胶囊 (HUD)</span>
        <label class="pt-switch">
          <input type="checkbox" id="toggle-hud" checked>
          <span class="pt-slider"></span>
        </label>
      </div>
    </div>

    <!-- Section Header -->
    <div class="pt-section-header">
      <div class="pt-section-left">
        <span class="pt-section-title">今日阅读流</span>
        <span class="pt-count-badge" id="paper-list-count">0</span>
      </div>
      <div class="pt-source-legend">
        <span class="pt-legend-dot pt-legend-arxiv"></span>
        <span class="pt-legend-name">arXiv</span>
        <span class="pt-legend-dot pt-legend-alphaxiv"></span>
        <span class="pt-legend-name">alphaXiv</span>
      </div>
    </div>

    <!-- Paper Stream Cards -->
    <main class="pt-paper-stream" id="paper-stream">
      <!-- Dynamically filled by popup.js -->
    </main>

    <!-- Toast Notification -->
    <div class="pt-toast" id="pt-toast" style="display: none;">
      <span id="toast-msg">已复制今日论文 Markdown！</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
