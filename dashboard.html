<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PaperTracker · 论文阅读总览看板</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="db-wrapper">
    <!-- Sidebar / Topbar Navigation -->
    <header class="db-header">
      <div class="db-brand">
        <div class="db-logo">📄</div>
        <div>
          <h1 class="db-title">PaperTracker Dashboard</h1>
          <p class="db-subtitle">论文阅读轨迹 · 专注时长 · 习惯可视化</p>
        </div>
      </div>
      <div class="db-actions">
        <button id="btn-export-markdown" class="db-btn db-btn-primary">
          <span>📋 导出全量 Markdown</span>
        </button>
        <button id="btn-export-json" class="db-btn db-btn-secondary">
          <span>💾 备份 JSON</span>
        </button>
      </div>
    </header>

    <!-- Stat Metric Cards (Bento 4-Grid) -->
    <section class="db-stats-grid">
      <div class="db-stat-card">
        <div class="db-stat-icon">📚</div>
        <div class="db-stat-info">
          <span class="db-stat-label">累积阅读论文</span>
          <span class="db-stat-value" id="stat-total-papers">0 篇</span>
        </div>
      </div>

      <div class="db-stat-card">
        <div class="db-stat-icon">⏱️</div>
        <div class="db-stat-info">
          <span class="db-stat-label">总专注阅读时长</span>
          <span class="db-stat-value" id="stat-total-time">0 小时</span>
        </div>
      </div>

      <div class="db-stat-card">
        <div class="db-stat-icon">🔥</div>
        <div class="db-stat-info">
          <span class="db-stat-label">当前连续打卡</span>
          <span class="db-stat-value" id="stat-current-streak">0 天</span>
        </div>
      </div>

      <div class="db-stat-card">
        <div class="db-stat-icon">🏆</div>
        <div class="db-stat-info">
          <span class="db-stat-label">历史最佳连击</span>
          <span class="db-stat-value" id="stat-best-streak">0 天</span>
        </div>
      </div>
    </section>

    <!-- Reading Heatmap / Calendar Visualization -->
    <section class="db-section-card">
      <div class="db-section-header">
        <h2 class="db-section-title">📅 近期阅读热力图 (Last 30 Days)</h2>
        <span class="db-heatmap-legend">
          <span>少</span>
          <span class="db-legend-box lvl-0"></span>
          <span class="db-legend-box lvl-1"></span>
          <span class="db-legend-box lvl-2"></span>
          <span class="db-legend-box lvl-3"></span>
          <span>多</span>
        </span>
      </div>
      <div class="db-heatmap-grid" id="heatmap-container">
        <!-- Generated by dashboard.js -->
      </div>
    </section>

    <!-- History & Search Table -->
    <section class="db-section-card">
      <div class="db-section-header">
        <h2 class="db-section-title">📑 历史阅读论文库</h2>
        <div class="db-search-bar">
          <input type="text" id="search-input" placeholder="搜索论文标题、arXiv ID、作者...">
          <select id="filter-source">
            <option value="all">所有来源</option>
            <option value="arxiv">arXiv</option>
            <option value="alphaxiv">alphaXiv</option>
            <option value="blog">Research Blog</option>
          </select>
        </div>
      </div>

      <div class="db-table-container">
        <table class="db-table">
          <thead>
            <tr>
              <th>来源</th>
              <th>arXiv ID</th>
              <th>论文标题与作者</th>
              <th>累积时长</th>
              <th>阅读深度</th>
              <th>最近阅读时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="papers-table-body">
            <!-- Dynamically populated -->
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <div class="db-toast" id="db-toast" style="display: none;">已复制到剪贴板！</div>

  <script src="dashboard.js"></script>
</body>
</html>
